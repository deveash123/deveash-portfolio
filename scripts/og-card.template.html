<!doctype html>
<!--
  Generator page for the 1200x630 social card. Rendered against the BUILT css so
  the card uses the real self-hosted fonts and tokens, then deleted. Temporary.

  Sizing note: every length here is in CARD pixels, never vw. A vw value would
  resolve against the 1200px render viewport and blow the display word up to
  490px tall, which pushes the name under the footer. Anton advances ~3.73em,
  so 322px of type renders "PORTFOLIO" at ~1201px — exactly full bleed.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./assets/CSS_HERE.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .og {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: var(--color-paper);
        display: flex;
        flex-direction: column;
      }

      .og-bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 30px 44px 0;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--color-ink-soft);
      }

      .og-mark {
        font-family: var(--font-serif);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: none;
        color: var(--color-ink);
      }

      /* 322px * 3.73em advance = ~1201px, i.e. full bleed and cropped */
      .og-mega {
        margin-top: 8px;
        margin-inline: -44px;
        text-align: center;
        white-space: nowrap;
        font-size: 322px;
        line-height: 0.78;
        letter-spacing: -0.012em;
        color: var(--color-ink);
      }

      .og-body {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 48px;
        padding: 18px 44px 0;
        flex: 1;
        min-height: 0;
      }

      .og-name {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: 52px;
        line-height: 0.94;
        letter-spacing: -0.02em;
        color: var(--color-ink);
      }

      .og-role {
        margin-top: 12px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--color-clay);
      }

      .og-meta {
        margin-top: 12px;
        font-size: 15px;
        color: var(--color-ink-soft);
      }

      .og-visual {
        position: relative;
        height: 246px;
        width: 246px;
        flex: 0 0 auto;
      }

      .og-disc {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 84%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: var(--color-clay);
      }

      .og-visual img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom;
      }

      .og-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin: 20px 44px 0;
        padding-top: 16px;
        border-top: 1px solid var(--color-rule);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-ink-faint);
      }

      .og-foot b {
        color: var(--color-clay);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og-bar">
        <span class="og-mark">Deveash G.</span>
        <span>Product Developer &nbsp;·&nbsp; Game Developer &nbsp;·&nbsp; App Developer</span>
      </div>

      <div class="og-mega">PORTFOLIO</div>

      <div class="og-body">
        <div>
          <p
            style="
              font-size: 12px;
              font-weight: 800;
              letter-spacing: 0.24em;
              text-transform: uppercase;
              color: var(--color-ink-soft);
            "
          >
            I build games, apps &amp; AI-powered products
          </p>
          <p class="og-name">Deveash G.</p>
          <p class="og-role">Computer Science &amp; Engineering</p>
          <p class="og-meta">Chennai, Tamil Nadu, India</p>
        </div>

        <div class="og-visual">
          <div class="og-disc"></div>
          <img src="./portrait.png" alt="" />
        </div>
      </div>

      <div class="og-foot">
        <span>gdeveash.vercel.app</span>
        <span><b>github.com/deveash123</b></span>
        <span>linkedin.com/in/deveashg</span>
        <span>gdeveash@gmail.com</span>
      </div>
    </div>
  </body>
</html>
